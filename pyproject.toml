[build-system]
requires = ["setuptools >= 70"]
build-backend = "setuptools.build_meta"

[project]
name = "newton"
authors = [
  { name="Peter Zakariya", email="peter_zakariya@berkeley.edu" },
]
description = "A Python library for Newton methods"
readme = "README.md"

requires-python = ">=3.10"
dependencies = [
    "numdifftools",
    "numpy",
]

license = "BSD-3-Clause"
license-files = ["LICEN[CS]E*"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent"
]

keywords = ["tools", "newton"]
dynamic = ["version"]

[tool.setuptools]
packages = ["newton"]
